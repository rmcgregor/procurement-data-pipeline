version: 2

models:
  - name: current_procurements
    description: "One row per procurement process representing its latest release"
    columns:
      - name: ocid
        description: "Unique identifier for a procurement"
        data_tests:
          - not_null
          - unique
      - name: release_id
        description: "Identifier of the latest release for the procurement process"
        data_tests:
          - not_null
  - name: current_awards
    description: "Awards present in the latest release of each procurement process"
    columns:
    - name: ocid
      description: "Unique identifier for the procurement process"
      data_tests:
        - not_null

    - name: award_id
      description: "Identifier of the award within the procurement process"
      data_tests:
        - not_null
  - name: dim_suppliers
    description: "One row per supplier using the latest known supplier name"
    columns:
    - name: supplier_key
      description: "Unique supplier key, using supplier ID where available and supplier name where the source ID is unreliable"
      data_tests:
        - not_null
        - unique

    - name: supplier_name
      description: "Latest known name for the supplier"
      data_tests:
        - not_null
  - name: award_suppliers
    description: "Bridge between current awards and their suppliers"
    columns:
    - name: ocid
      description: "Identifier for the procurement process"
      data_tests:
        - not_null

    - name: award_id
      description: "Identifier for the award"
      data_tests:
        - not_null

    - name: supplier_key
      description: "Key identifying the supplier"
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_suppliers')
              field: supplier_key
  - name: dim_buyers
    description: "One row per buyer using the latest known buyer details"
    columns:
    - name: buyer_id
      description: "Unique identifier for the buyer organisation"
      data_tests:
        - not_null
        - unique

  - name: procurement_buyers
    description: "Bridge between procurement processes and buyer organisations"
    columns:
    - name: ocid
      description: "Identifier for the procurement process"
      data_tests:
        - not_null

    - name: buyer_id
      description: "Identifier for the buyer organisation"
      data_tests:
        - not_null
  - name: dim_geography
    description: "One row per valid buyer postcode with ONS geographic classifications"
    columns:
      - name: postcode_key
        description: "Normalised postcode used to link buyers to geography"
        data_tests:
          - not_null
          - unique
  - name: dim_date
    description: "Calendar date dimension for time-based analysis and reporting"
    columns:
      - name: date
        description: "Calendar date"
        data_tests:
          - not_null
          - unique

      - name: date_key
        description: "Integer date key in YYYYMMDD format"
        data_tests:
          - not_null
          - unique
  - name: dim_cpv_categories
    description: "One row per unique CPV procurement classification"
    columns:
      - name: cpv_code
        description: "Common Procurement Vocabulary classification code"
        data_tests:
          - not_null
          - unique

      - name: cpv_description
        description: "Description of the CPV classification"
  - name: procurement_categories
    description: "Bridge linking procurements to their CPV classifications"
    columns:
      - name: ocid
        description: "Procurement process identifier"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_procurement_overview')
                field: ocid

      - name: cpv_code
        description: "CPV classification code"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cpv_categories')
                field: cpv_code
  - name: dim_cpv_divisions
    columns:
      - name: cpv_division_code
        data_tests:
          - not_null
          - unique
  - name: gold_procurement_overview
    description: "One row per procurement process with latest details and framework classification"
    columns:
      - name: ocid
        description: "Unique procurement process identifier"
        data_tests:
          - not_null
          - unique

      - name: framework_status
        description: "Framework classification derived from OCDS release history"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Framework
                  - Not framework
                  - Unknown